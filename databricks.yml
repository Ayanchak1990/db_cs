bundle:
  name: dcs

include:
  - resources/*.yml

variables:
  ENV:
    default: dev
  catalog:
    description: Unity Catalog name for this environment
  control_schema:
    description: Schema name for control/metadata tables
    default: deltek_cdm
  raw_schema:
    description: Schema name for raw layer tables
    default: raw
  silver_schema:
    description: Schema name for silver layer tables
    default: silver
  gold_schema:
    description: Schema name for gold layer tables
    default: gold
  secret_scope:
    default: ""

targets:

  dev:
    mode: development
    default: true
    presets:
      tags:
        environment: dev
        project: deltek_control_schema
    workspace:
      host: https://dbc-6e076fbc-a34a.cloud.databricks.com/
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    variables:
      ENV: test
      catalog: db_certification
      control_schema: test_schema
      secret_scope: ""