resources:
  jobs:
    control_schema_setup:
      name: "[${var.ENV}] dcs Setup"
      description: "Creates all control metadata tables for the Deltek ingestion framework"

      tasks:
        - task_key: run_control_schema_ddl
          description: "Execute all control schema DDL scripts in order"
          spark_python_task:
            python_file: ../src/control_schema/run_ddl.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--control_schema"
              - "${var.control_schema}"
          environment_key: serverless

        - task_key: seed_control_schema
          description: "Seed 5 config tables with initial pipeline configuration"
          depends_on:
            - task_key: run_control_schema_ddl
          spark_python_task:
            python_file: ../src/control_schema/seed/seed_source_object_config.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--control_schema"
              - "${var.control_schema}"
              - "--environment"
              - "${var.ENV}"
              - "--config_path"
              - "/Workspace/Users/ayan.chakraborty@eucloid.com/.bundle/dcs/dev/files/src/control_schema/seed/seed_config.json"
          environment_key: serverless

      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - setuptools

      tags:
        project: deltek_control_schema
        layer: control
        env: ${var.ENV}